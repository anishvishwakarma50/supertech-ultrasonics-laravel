name: Deploy Laravel Application

on:
  push:
    branches:
      - main # Automatically deploys on push or merge to main
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  deploy:
    name: Build & Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build frontend assets
        run: |
          npm ci || npm install
          npm run build

      - name: Upload compiled assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "public/build"
          target: "${{ secrets.PROJECT_PATH }}"

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting deployment on remote server..."
            
            # 1. Navigate to the project directory
            cd ${{ secrets.PROJECT_PATH }}
            
            # 2. Put application into maintenance mode
            php artisan down || true
            
            # 3. Pull latest changes from git
            git fetch origin main
            git reset --hard origin/main
            
            # 4. Install/update PHP dependencies (no dev dependencies)
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            
            # 5. Run database migrations
            php artisan migrate --force
            
            # 6. Clear and optimize Laravel caches
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # 7. Bring application back online
            php artisan up
            
            echo "✅ Deployment finished successfully!"
